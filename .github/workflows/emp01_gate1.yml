name: EMP-01 Gate 1

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run scientific consistency and fail-closed tests
        run: python -B -m unittest -v test_emp01_gate1.py
      - name: Run labelled synthetic demonstration
        run: python -B emp01_analyzer.py fixtures/emp01_gate1_synthetic.csv --synthetic
      - name: Check report and artifact hashes
        run: |
          python -B falsifiable_predictions.py
          python -B verify_gate1_manifest.py
